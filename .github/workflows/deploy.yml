name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      platform:
        description: 'Deployment platform'
        required: true
        type: choice
        options:
          - fly
          - render
          - docker
          - all
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 22.x

jobs:
  # Build and test before deployment
  pre-deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules (retry)
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule update failed (attempt $attempt/5). Retrying…"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Setup pnpm (corepack retry)
        run: |
          set -euo pipefail
          corepack enable
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10.23.0 --activate; then
              pnpm -v
              exit 0
            fi
            echo "corepack prepare failed (attempt $attempt/3). Retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install dependencies
        env:
          CI: true
        run: pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check deployment eligibility
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Lint check
        run: pnpm lint

  # Deploy to Fly.io
  deploy-fly:
    needs: pre-deploy
    if: |
      needs.pre-deploy.outputs.should-deploy == 'true' &&
      (github.event.inputs.platform == 'fly' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          if [ "$ENV" = "staging" ]; then
            flyctl deploy --config fly.toml --app openclaw-staging
          else
            flyctl deploy --config fly.toml --app openclaw
          fi

      - name: Verify deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          APP_NAME="openclaw"
          if [ "$ENV" = "staging" ]; then
            APP_NAME="openclaw-staging"
          fi
          
          echo "Checking deployment status for $APP_NAME..."
          flyctl status --app $APP_NAME
          
          echo "Checking recent logs..."
          flyctl logs --app $APP_NAME --limit 50

  # Deploy to Render
  deploy-render:
    needs: pre-deploy
    if: |
      needs.pre-deploy.outputs.should-deploy == 'true' &&
      (github.event.inputs.platform == 'render' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Wait for deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Waiting for Render deployment to complete..."
          for i in {1..30}; do
            STATUS=$(curl -s "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.service.serviceDetails.server.status')
            
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "running" ]; then
              echo "Deployment successful!"
              exit 0
            fi
            
            sleep 10
          done
          
          echo "Deployment timed out"
          exit 1

  # Build and push Docker image
  deploy-docker:
    needs: pre-deploy
    if: |
      needs.pre-deploy.outputs.should-deploy == 'true' &&
      (github.event.inputs.platform == 'docker' || github.event.inputs.platform == 'all' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.event.inputs.environment == 'staging' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub release
  create-release:
    needs: [pre-deploy, deploy-fly, deploy-render, deploy-docker]
    if: |
      always() &&
      needs.pre-deploy.outputs.should-deploy == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.pre-deploy.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            # Extract the section for this version
            sed -n "/## \[*${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d' > /tmp/changelog.txt
            if [ -s /tmp/changelog.txt ]; then
              echo "Found changelog for version $VERSION"
            else
              echo "No changelog entry found, using generic message"
              echo "Release version $VERSION" > /tmp/changelog.txt
            fi
          else
            echo "No CHANGELOG.md found, using generic message"
            echo "Release version $VERSION" > /tmp/changelog.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true

  # Post-deployment health checks
  health-check:
    needs: [deploy-fly, deploy-render]
    if: |
      always() &&
      (needs.deploy-fly.result == 'success' || needs.deploy-render.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check Fly.io health
        if: needs.deploy-fly.result == 'success'
        run: |
          ENV="${{ github.event.inputs.environment || 'production' }}"
          if [ "$ENV" = "staging" ]; then
            URL="https://openclaw-staging.fly.dev/health"
          else
            URL="https://openclaw.fly.dev/health"
          fi
          
          echo "Checking health endpoint: $URL"
          for i in {1..10}; do
            if curl -f -s "$URL" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check failed, retrying..."
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Check Render health
        if: needs.deploy-render.result == 'success'
        run: |
          # Add Render health check URL if available
          echo "Render deployment successful, manual verification recommended"

  # Notify deployment status
  notify:
    needs: [pre-deploy, deploy-fly, deploy-render, deploy-docker, health-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.health-check.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Deployment completed successfully" >> $GITHUB_OUTPUT
          elif [ "${{ needs.health-check.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Deployment completed but health checks failed" >> $GITHUB_OUTPUT
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "message=Some deployment steps were skipped or failed" >> $GITHUB_OUTPUT
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.pre-deploy.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ steps.status.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Status" >> $GITHUB_STEP_SUMMARY
          echo "- Fly.io: ${{ needs.deploy-fly.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Render: ${{ needs.deploy-render.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.deploy-docker.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
